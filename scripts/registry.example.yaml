# registry.example.yaml —— 守卫注册表 · 空表模板（技能自带模板，非项目实例）
#
# 角色：经验系统新守卫的登记处（**项目实例数据**：守卫属于具体仓库，本文件只是结构模板）。
#   - 「批准落盘」阶段在此登记条目，dispatcher 据此把守卫挂进 commit 前钩子路由；
#   - 「条目-守卫绑定门禁」用它做存在性判据：Entry.guard_ref 指向的 key 必须在项目实例表内
#     （guard_ref 的**形态**校验在 validate.mjs，**存在性**校验在门禁层 —— 单一归宿，不重复实现）。
#
# ===== 条目结构：与宿主 commit 钩子的守卫数组同构（key / args / when 三键）=====
#   key  : 守卫唯一名（小写连字符形态，validate.mjs 的 GUARD_KEY_RE 强制）。
#          钩子日志与 Entry.guard_ref 引用的都是它。
#   args : 直调参数序列，**不经包管理器 run 层**（性能细节：省包管理器冷启动 1-2s/次）。
#          同构于钩子守卫数组的 args，如 [scripts/guards/xxx.sh]。
#   when : 声明性注解（票 H2 校正 · 此前成文说「由派发器翻译回谓词」，与实现不符）：
#          记录该守卫在宿主钩子守卫数组里的**触发面**，供人读；**派发器不求值**，
#          run-guard.mjs --all 无条件遍历全表（全量派发为准，见 schema.md §3 的三条理由：
#          过滤会掐断 shadow 计数 / 谓词对象是宿主自有 plan 字段、与零项目耦合冲突 /
#          被跳过的守卫与「起不来」在报表上同形 = 静默失效）。
#          --dry-run 会原样列出该注解并标注「未求值」，不让注解冒充已接线的假象。
#          仍必填（非空字符串）只为与宿主钩子守卫数组保持同构、便于人工对账，不承担运行时语义。
#
# v0 允许附加键（校验器不拒绝）：如 mode / shadow 等 shadow 语义的元数据。
#
# ===== 接入方式（每个项目自行替换）=====
#   复制本文件到项目配置的 storage.registry 路径（默认 `.self-improving/registry.yaml`），
#   按项目守卫实况登记条目。
#
# 校验：条目结构判据 = validate.mjs 导出的 validateRegistryEntry（测试覆盖红/绿两向）。
# 性能：本表只在 commit 时读一次、量级 ≤ 几十条；即便如此也**禁止**为读它起子进程 ——
#   与 validate.mjs 同款 O(1) spawn 反身约束（逐文件 spawn 的前科：48 条目 ≈ 98 秒）。

guards: []
