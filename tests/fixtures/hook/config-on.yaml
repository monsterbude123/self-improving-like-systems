# hook fixture 配置 · 开态（SessionStart 接线验收用；实例配置 kill-switch 默认值不受影响）
version: 1

scope:
  values: [infra, testing, git, data-ui, model, kb, other]
  default: other

injection:
  top_k: 5
  budget_chars: 800   # 足够放下完整块（不触发字符预算降级）
  budget_ms: 300
  timeout_ms: 3000

retire:
  cycle_days: 90

hook:
  default_scopes: [infra, testing]   # 接线验收断言的域来源

storage:
  entries_dir: entries/
  events_dir: events/
  proposals_dir: proposals/
  registry: registry.yaml
  audit_log: audit/audit.jsonl

event_sources:
  - gate
  - hook
  - tool
  - manual

kill_switch:
  injection: true
  capture: false
  distill: false
