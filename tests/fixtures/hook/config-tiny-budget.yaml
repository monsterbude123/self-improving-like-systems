# hook fixture 配置 · 字符预算极小（断言 SessionStart 走 inject.mjs 的标题行降级路径）
version: 1

scope:
  values: [infra, testing, git, data-ui, model, kb, other]
  default: other

injection:
  top_k: 5
  budget_chars: 120
  budget_ms: 300
  timeout_ms: 3000

retire:
  cycle_days: 90

hook:
  default_scopes: [infra, testing]

storage:
  entries_dir: entries/
  events_dir: events/
  proposals_dir: proposals/
  registry: registry.yaml
  audit_log: audit/audit.jsonl

event_sources:
  - gate
  - hook
  - tool
  - manual

kill_switch:
  injection: true
  capture: false
  distill: false
